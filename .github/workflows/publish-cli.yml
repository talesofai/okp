name: Publish CLI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "CLI version to publish (e.g. 1.1.2). Leave empty to auto-bump patch from npm/package.json."
        required: false
        type: string

# Trusted Publishing (OIDC) requires id-token: write and must NOT inject NODE_AUTH_TOKEN.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Do NOT set registry-url here: it writes //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # and breaks npm Trusted Publishing OIDC (npm then returns E404 on PUT).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ensure modern npm for OIDC provenance
        run: npm install -g npm@latest

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            CURRENT=$(node -p "require('./npm/package.json').version")
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing CLI version: $VERSION"

      - name: Build and publish
        env:
          # Force OIDC trusted publishing; classic token auth must stay unset.
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          # Remove any auth token lines that would force classic publish.
          npm config delete //registry.npmjs.org/:_authToken || true
          unset NODE_AUTH_TOKEN NPM_TOKEN || true
          ./scripts/publish-cli.sh "${{ steps.version.outputs.version }}"
